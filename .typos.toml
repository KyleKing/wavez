[files]
# Generated from commit subjects by commitizen, so a typo here can only be fixed
# by rewriting history. Catch it in the commit message instead.
# The vim tests describe keystroke sequences ("ab<esc>IZ"), where a run of
# letters is input and not a word.
extend-exclude = ["CHANGELOG.md", "internal/tui/vim_test.go"]

# Identifiers and prefixes typos reads as misspellings: golangci-lint linter
# names, a TUI framework, and an English prefix.
[default.extend-words]
Ratatui = "Ratatui"
decorder = "decorder"
importas = "importas"
mis = "mis"
