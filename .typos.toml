[files]
# Generated from commit subjects by commitizen, so a typo here can only be fixed
# by rewriting history. Catch it in the commit message instead.
extend-exclude = ["CHANGELOG.md"]

# Identifiers and prefixes typos reads as misspellings: golangci-lint linter
# names, a TUI framework, an English prefix, an Apache project surveyed in
# the first design, an HTML character reference name (`&curren` is the
# currency sign, and is why `&current` collapses), and the stem a benchmark
# check greps for so it matches both truncate and truncation.
[default.extend-words]
Ratatui = "Ratatui"
curren = "curren"
decorder = "decorder"
importas = "importas"
maka = "maka"
mis = "mis"
truncat = "truncat"
