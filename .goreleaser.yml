
version: 2

before:
  # No test hook: the release builds a tag CI already tested, and goreleaser
  # runs outside mise, so a test needing pkl or goimports fails here only.
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/wavez
    id: wavez
    # tree-sitter's Go bindings are cgo-only and cgo cannot cross-compile, so
    # the matrix is darwin-native. The Seatbelt sandbox is macOS-only anyway.
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    binary: wavez

  # The TUI attaches to a running daemon, so a release without wavezd ships a
  # client with nothing to connect to.
  - main: ./cmd/wavezd
    id: wavezd
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    binary: wavezd

archives:
  - id: wavez
    ids: [wavez, wavezd]
    formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto

homebrew_casks:
  - name: wavez
    # Pushed over SSH with a deploy key scoped to the tap repo, since GitHub
    # offers no API to mint PATs; provisioned by scripts/provision-tap-deploy-key.sh.
    repository:
      owner: kyleking
      name: homebrew-tap
      git:
        url: git@github.com:kyleking/homebrew-tap.git
        private_key: '{{ envOrDefault "TAP_DEPLOY_KEY" "" }}'
    homepage: https://github.com/kyleking/wavez
    description: "A personal AI coding agent for one user, one laptop, and repeated narrow work"
    # Without the TAP_DEPLOY_KEY secret the tap push is skipped with a warning
    # and the rest of the release still publishes, so a project that has not
    # been provisioned yet needs no config change here.
    skip_upload: '{{ if isEnvSet "TAP_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    # The binaries are unsigned; clear the quarantine bit so macOS will run them.
    hooks:
      post:
        install: |
          Dir.glob(File.join(staged_path, "wavez*")).each do |f|
            system_command "/usr/bin/xattr", args: ["-c", f], must_succeed: false
          end
