# Benchmark tasks on Hatchet (https://github.com/hatchet-dev/hatchet) whose
# change lands in a package most of the module imports. tasks_hatchet.toml
# holds the tasks whose change stays in a leaf package; the format is the one
# tasks.toml documents. The comment on each task counts the packages that
# import the changed one, directly or through others, out of 356.
#
# A whole-project build or test is what these tasks tempt an agent into, and
# what `wavez check` is meant to replace. Its test selection needs a detest
# trace of the pinned commit, which README.md beside this file says how to
# make and hand to the wired arms with --overlay.
#
# Every check runs offline once the module's dependencies are downloaded.

# pkg/client/types: 242 importers.
[[task]]
id = "hw-go-action"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "ParseActionID in pkg/client/types accepts an action id with an empty part, such as 'svc:', ':run', or 'svc:run:', and leaves every caller to check for it. Make it return an error when the service, the verb, or a subresource that is present is empty, and cover that in the package's tests."
checks = [
  '''cmd:f=pkg/client/types/wavez_bench_action_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOT'
package types

import "testing"

func TestWavezBenchEmptyParts(t *testing.T) {
	for _, id := range []string{"svc:", ":run", ":", "svc:run:", "svc::sub"} {
		if _, err := ParseActionID(id); err == nil {
			t.Errorf("ParseActionID(%q) returned no error", id)
		}
	}
	got, err := ParseActionID("Svc:Run:Sub")
	if err != nil || got != (Action{Service: "svc", Verb: "run", Subresource: "sub"}) {
		t.Errorf("ParseActionID(Svc:Run:Sub) = %+v, %v", got, err)
	}
	if got, err := ParseActionID("svc:run"); err != nil || got != (Action{Service: "svc", Verb: "run"}) {
		t.Errorf("ParseActionID(svc:run) = %+v, %v", got, err)
	}
}
EOT
go test -count=1 ./pkg/client/types/ ./pkg/validator/''',
]

# pkg/enums: 252 importers.
[[task]]
id = "hw-go-narrow"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "pkg/enums has Narrow for converting between enums that share value names, but nothing for an optional value, so callers unwrap and rewrap pointers by hand. Add NarrowPtr beside it, taking a pointer to the source value and returning a pointer to the target and a bool: nil gives nil and true, and a value the target's Valid method rejects gives nil and false. Test it in that package."
checks = [
  "pkg/enums/narrow.go:func NarrowPtr[",
  '''cmd:f=pkg/enums/wavez_bench_narrow_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOT'
package enums_test

import (
	"testing"

	"github.com/hatchet-dev/hatchet/pkg/enums"
)

func TestWavezBenchNarrowPtr(t *testing.T) {
	var none *enums.V1ReadableStatusOlap
	if got, ok := enums.NarrowPtr[enums.V1TaskStatus](none); got != nil || !ok {
		t.Errorf("nil gave %v, %v", got, ok)
	}
	running := enums.V1ReadableStatusOlapRUNNING
	got, ok := enums.NarrowPtr[enums.V1TaskStatus](&running)
	if !ok || got == nil || *got != enums.V1TaskStatusRUNNING {
		t.Errorf("RUNNING gave %v, %v", got, ok)
	}
	evicted := enums.V1ReadableStatusOlapEVICTED
	if got, ok := enums.NarrowPtr[enums.V1TaskStatus](&evicted); got != nil || ok {
		t.Errorf("EVICTED gave %v, %v", got, ok)
	}
}
EOT
go test -count=1 ./pkg/enums/''',
]

# pkg/validator: 236 importers.
[[task]]
id = "hw-go-password"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "The password rule in pkg/validator measures length in bytes, so a 30-character password written in Cyrillic or Japanese is refused as longer than 64, and a 4-character one can pass as 8. Measure it in characters, and add test cases for both."
checks = [
  '''cmd:f=pkg/validator/wavez_bench_password_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOT'
package validator

import (
	"strings"
	"testing"
)

func TestWavezBenchPasswordCountsCharacters(t *testing.T) {
	long := strings.Repeat("あ", 30) + "aA1"
	if !passwordValidation(long) {
		t.Errorf("33 characters in %d bytes was refused", len(long))
	}
	if short := "あaA1"; passwordValidation(short) {
		t.Errorf("4 characters in %d bytes was accepted", len(short))
	}
	if !passwordValidation("Abcdefg1") || passwordValidation("Abcdef1") {
		t.Error("the 8-character floor moved")
	}
	if !passwordValidation(strings.Repeat("a", 62)+"A1") || passwordValidation(strings.Repeat("a", 63)+"A1") {
		t.Error("the 64-character ceiling moved")
	}
}
EOT
go test -count=1 ./pkg/validator/''',
]

# pkg/client/retry: 153 importers.
[[task]]
id = "hw-go-retryafter"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "Some gateways send the Retry-After header with padding, such as ' 2' or '2 '. The Go client's REST retry in pkg/client/retry treats that as invalid and falls back to its own backoff. Make it accept surrounding whitespace for both the seconds form and the HTTP-date form, and add tests."
checks = [
  '''cmd:f=pkg/client/retry/wavez_bench_retryafter_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOT'
package retry

import (
	"net/http"
	"testing"
	"time"
)

func TestWavezBenchRetryAfterPadding(t *testing.T) {
	now := time.Unix(0, 0).UTC()
	date := now.Add(3 * time.Second).Format(http.TimeFormat)
	for in, want := range map[string]time.Duration{
		" 2": 2 * time.Second, "2 ": 2 * time.Second, "\t2\t": 2 * time.Second, "2": 2 * time.Second,
		" " + date + " ": 3 * time.Second,
	} {
		got, ok := parseRetryAfter(in, now, restMaxRetryAfter)
		if !ok || got != want {
			t.Errorf("parseRetryAfter(%q) = %v, %v, want %v", in, got, ok, want)
		}
	}
	for _, in := range []string{"", "   ", "2 s", "-1", " 10 "} {
		if got, ok := parseRetryAfter(in, now, restMaxRetryAfter); ok {
			t.Errorf("parseRetryAfter(%q) = %v, want it refused", in, got)
		}
	}
}
EOT
go test -count=1 ./pkg/client/retry/''',
]

# pkg/config/loader/loaderutils: 156 importers.
[[task]]
id = "hw-go-tls"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "Operators copy the TLS minimum version from their nginx and OpenSSL configs, where it is spelled TLSv1.2 or TLSv1.3, and Hatchet refuses to start with 'unsupported TLS minimum version'. Accept that spelling in any letter case alongside the ones it takes today, say so in the error message, and extend the tests."
checks = [
  "pkg/config/loader/loaderutils/tls_test.go:v1.",
  '''cmd:f=pkg/config/loader/loaderutils/wavez_bench_tls_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOT'
package loaderutils

import (
	"crypto/tls"
	"testing"
)

func TestWavezBenchTLSSpelling(t *testing.T) {
	for in, want := range map[string]uint16{
		"TLSv1.2": tls.VersionTLS12, "tlsv1.2": tls.VersionTLS12, " TLSV1.3 ": tls.VersionTLS13,
		"TLSv1.3": tls.VersionTLS13, "1.2": tls.VersionTLS12, "tls13": tls.VersionTLS13, "": tls.VersionTLS13,
	} {
		got, err := ParseTLSMinVersion(in)
		if err != nil || got != want {
			t.Errorf("ParseTLSMinVersion(%q) = %d, %v, want %d", in, got, err, want)
		}
	}
	for _, in := range []string{"TLSv1.1", "v1.2x", "SSLv3", "1.4"} {
		if _, err := ParseTLSMinVersion(in); err == nil {
			t.Errorf("ParseTLSMinVersion(%q) returned no error", in)
		}
	}
}
EOT
go test -count=1 ./pkg/config/loader/loaderutils/''',
]

# internal/datautils: 95 importers.
[[task]]
id = "hw-go-render"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "RenderTemplateFields in internal/datautils panics with a nil pointer dereference when the input has a null value, for example a step input decoded from {\"note\": null}, at any depth. A null should be copied through as it is. Fix it and add a test case."
checks = [
  '''cmd:f=internal/datautils/wavez_bench_render_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOT'
package datautils

import (
	"reflect"
	"testing"
)

func TestWavezBenchRenderNull(t *testing.T) {
	data := map[string]interface{}{"name": "hatchet"}
	input := map[string]interface{}{
		"note": nil, "greeting": "hi {{.name}}", "count": 3,
		"nested": map[string]interface{}{"inner": nil, "who": "{{.name}}"},
	}
	want := map[string]interface{}{
		"note": nil, "greeting": "hi hatchet", "count": 3,
		"nested": map[string]interface{}{"inner": nil, "who": "hatchet"},
	}
	got, err := RenderTemplateFields(data, input)
	if err != nil || !reflect.DeepEqual(got, want) {
		t.Errorf("got %#v, %v", got, err)
	}
	if _, err := RenderTemplateFields(data, map[string]interface{}{"bad": map[string]string{"a": "b"}}); err == nil {
		t.Error("a map of another type was accepted")
	}
}
EOT
go test -count=1 ./internal/datautils/''',
]
