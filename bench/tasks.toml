# Benchmark tasks. Each runs in a throwaway checkout of `repo` at `rev`, under
# plain Claude Code (arm baseline) and under Claude Code with wavez wired in
# (arm wavez). See README.md beside this file.
#
#   id      unique name
#   prompt  what the harness is asked, verbatim
#   repo    path (relative to this file) or clone URL; default is the repository
#           this file lives in
#   rev     the commit to check out, required so a task never drifts
#   checks  what a finished run must satisfy:
#             path:substring     the file contains the substring
#             answer:substring   the harness's final text contains it
#             build:<pattern>    `go build <pattern>` exits 0
#             test:<pattern>     `go test <pattern>` exits 0
#             cmd:<command>      `sh -c <command>` exits 0
#           a leading ! inverts any of them. A task with no check can never
#           pass: it records what a run spent and proves nothing about it.
#
# These seventeen are the old agent loop's timing set, pinned to the last commit
# of that tree.

