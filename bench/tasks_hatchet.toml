[[task]]
id = "he-ts-duration"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "In the TypeScript SDK, durationToString drops the sub-second part of a duration given in milliseconds: 1500 becomes '1s'. Keep the fraction as decimal seconds, so 1500 becomes '1.5s' and 90500 becomes '1m30.5s', and leave whole-second output as it is."
checks = [
  '''cmd:node --no-warnings --input-type=module <<'EOF'
import { durationToString as d, durationToMs as ms } from './sdks/typescript/src/v1/client/duration.ts';
const cases = [[1500, '1.5s'], [90500, '1m30.5s'], [250, '0.25s'], [1, '0.001s'], [0, '0s'], [61000, '1m1s'], [3600000, '1h'], [3725000, '1h2m5s'], ['10m', '10m'], [{ minutes: 2 }, '2m']];
for (const [input, want] of cases) {
  const got = d(input);
  if (got !== want) { console.log(`durationToString(${JSON.stringify(input)}) = ${JSON.stringify(got)}, want ${JSON.stringify(want)}`); process.exit(1); }
}
if (ms(d(90500)) !== 90500) { console.log('durationToMs does not read the output back'); process.exit(1); }
EOF''',
]

