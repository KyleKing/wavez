repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "The load report in hack/ci/loadreport redacts credential-shaped text before posting it on a pull request, but it lets GitLab personal access tokens through (glpat- followed by 20 or more letters, digits, underscores, or dashes). Redact them, list them in the sanitization policy, and cover them both in the unit tests for the secret rules and in the end-to-end test that checks every sink."
checks = [
  "hack/ci/loadreport/sanitize.go:glpat",
  "hack/ci/loadreport/sanitize_test.go:glpat",
  "hack/ci/loadreport/main_test.go:glpat",
  '''cmd:f=hack/ci/loadreport/wavez_bench_redact_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOF'
package main

import (
	"strings"
	"testing"
)

func TestWavezBenchRedactsGitLab(t *testing.T) {
	for _, in := range []string{
		"remote rejected glpat-AbCdEfGhIjKlMnOpQrSt for this push",
		"glpat-a1_b2-c3d4e5f6g7h8i9j0kLmN",
	} {
		got := redactSecrets(in)
		if strings.Contains(got, "AbCdEfGhIjKlMnOpQrSt") || strings.Contains(got, "a1_b2-c3d4e5f6g7h8i9j0kLmN") {
			t.Errorf("redactSecrets(%q) = %q", in, got)
		}
	}
	if got := redactSecrets("plain text stays"); got != "plain text stays" {
		t.Errorf("plain text changed to %q", got)
	}
}
EOF
go test -count=1 ./hack/ci/loadreport/''',
]

[[task]]
id = "he-py-expr"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "In the Python SDK, timedelta_to_expr silently truncates: timedelta(milliseconds=1500) becomes '1s', and a negative timedelta yields an expression the engine cannot use. Make it raise ValueError for a negative duration or one that is not a whole number of seconds, and extend sdks/python/tests/test_durations.py to cover it."
checks = [
  "sdks/python/tests/test_durations.py:ValueError",
  "cmd:python3 -m py_compile sdks/python/hatchet_sdk/utils/timedelta_to_expression.py sdks/python/tests/test_durations.py",
  '''cmd:python3 -I - <<'EOF'
import importlib.util
import sys
from datetime import timedelta

spec = importlib.util.spec_from_file_location("m", "sdks/python/hatchet_sdk/utils/timedelta_to_expression.py")
m = importlib.util.module_from_spec(spec)
spec.loader.exec_module(m)

for td, want in [(timedelta(hours=2), "2h"), (timedelta(minutes=3), "3m"), (timedelta(seconds=3661), "3661s"), (timedelta(hours=96, seconds=1), "345601s")]:
    got = m.timedelta_to_expr(td)
    if got != want:
        sys.exit(f"timedelta_to_expr({td!r}) = {got!r}, want {want!r}")

for td in [timedelta(milliseconds=1500), timedelta(microseconds=1), timedelta(seconds=-5), timedelta(hours=-1)]:
    try:
        got = m.timedelta_to_expr(td)
    except ValueError:
        continue
    sys.exit(f"timedelta_to_expr({td!r}) = {got!r}, want ValueError")
EOF''',
]

