# Benchmark tasks on Hatchet (https://github.com/hatchet-dev/hatchet), a
# project wavez did not write: a Go engine and API with Python and TypeScript
# SDKs under sdks/. The format is the one tasks.toml documents. Run with
# `--tasks bench/tasks_hatchet.toml`; README.md beside this file says what the
# checks need installed.
#
# Every Go check targets a package that imports only the standard library, so
# it needs no module download. Python checks load one file by path, because
# importing hatchet_sdk pulls in grpc. TypeScript checks import one file with
# Node's built-in type stripping, because type-checking needs `pnpm install`.
#
# Each [[gate]] becomes a [[check]] in the .wavez.toml of a wired arm's
# workspace, since the built-in gates only know Go. The baseline arm gets none.
# Each prints one line per broken file, and a Node too old to strip types exits
# 127, which the gates read as a check that could not run.

[[gate]]
name = "py-syntax"
globs = ["sdks/python/**/*.py"]
command = '''python3 -c '
import sys
bad = 0
for f in sys.argv[1:]:
    try:
        compile(open(f, "rb").read(), f, "exec")
    except SyntaxError as e:
        bad = 1
        print(f"{f}:{e.lineno}: {e.msg}")
sys.exit(bad)
' {files}'''

[[gate]]
name = "ts-syntax"
globs = ["sdks/typescript/**/*.ts"]
command = '''node --no-warnings -e '
const strip = require("node:module").stripTypeScriptTypes;
if (typeof strip !== "function") process.exit(127);
let bad = 0;
for (const f of process.argv.slice(1)) {
  try {
    strip(require("node:fs").readFileSync(f, "utf8"), { mode: "transform" });
  } catch (e) {
    bad = 1;
    console.log(f + ": " + e.message.split("\n")[0]);
  }
}
process.exit(bad);
' {files}'''

