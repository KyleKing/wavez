[[task]]
id = "he-go-len"
repo = "https://github.com/hatchet-dev/hatchet.git"
rev = "290556fb419b76b39a6a42264600c0130edc4b1b"
prompt = "The generic TTLCache in internal/cache has no way to ask how many entries it holds. Add a Len method that counts only the entries that have not expired, with a table-driven test in that package."
checks = [
  "internal/cache/cache.go:) Len() int",
  '''cmd:f=internal/cache/wavez_bench_len_test.go
trap 'rm -f "$f"' EXIT
cat > "$f" <<'EOF'
package cache_test

import (
	"testing"
	"time"

	"github.com/hatchet-dev/hatchet/internal/cache"
)

func TestWavezBenchLen(t *testing.T) {
	c := cache.NewTTL[string, int]()
	defer c.Stop()
	if got := c.Len(); got != 0 {
		t.Fatalf("empty Len() = %d", got)
	}
	c.Set("a", 1, time.Hour)
	c.Set("b", 2, time.Hour)
	c.Set("gone", 3, time.Nanosecond)
	time.Sleep(20 * time.Millisecond)
	if got := c.Len(); got != 2 {
		t.Fatalf("Len() with one expired = %d, want 2", got)
	}
	c.Remove("a")
	if got := c.Len(); got != 1 {
		t.Fatalf("Len() after Remove = %d, want 1", got)
	}
}
EOF
go test -count=1 ./internal/cache/''',
]

