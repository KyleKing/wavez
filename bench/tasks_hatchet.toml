  "!sdks/typescript/src/util/serialize-payload.ts:Object keys are left as they are",
  "!cmd:git diff --quiet HEAD -- sdks/typescript/src/util/serialize-payload.test.ts",
  '''cmd:node --no-warnings --input-type=module <<'EOF'
import { serializePayload as s } from './sdks/typescript/src/util/serialize-payload.ts';
const fail = (msg) => { console.log(msg); process.exit(1); };
const lone = '\ud83d';
const out = s({ [lone + 'k']: { ['n' + lone]: [lone] }, d: new Date(0), u: undefined });
const want = JSON.stringify({ '�k': { 'n�': ['�'] }, d: '1970-01-01T00:00:00.000Z' });
if (out !== want) fail(`got ${out}, want ${want}`);
for (const v of ['x', 1, null, [1, 'a'], { a: { b: [true] } }, { toJSON: () => ({ [lone]: 1 }) }]) {
  const plain = JSON.stringify(v).replaceAll('\\ud83d', '\\ufffd');
  const got = s(v).replaceAll('�', '\\ufffd');
