[tasks."ci:project"]
description = "Gates only this project has, run by the template's CI project job"
depends = ["deadcode", "preamble:budget"]

[tasks.deadcode]
description = "Fail when a function no main reaches is not in the allowlist"
run = "go run ./cmd/wavez -deadcode"

[tasks."preamble:budget"]
description = "Fail when the fixed prefix every turn pays exceeds its ceiling"
run = "go run ./cmd/wavez -preamble -preamble-max 2450"

[tasks.daemon]
description = "Run wavezd from source (owns the socket the TUI/CLI dial into)"
run = "go run ./cmd/wavezd"
raw_args = true

[tasks."jj:pull"]
description = "Fetch from GitHub (only fast-forwards main if there is no local work on it)"
run = "jj git fetch"

[tasks."jj:sync"]
description = "Fetch from GitHub and rebase local work onto the latest main"
run = "jj git fetch && jj rebase -d 'trunk()'"

# `jj git push` fires no git hook, so every pre-push guard hk installs is inert
# here. This task is what runs them.
[tasks."jj:verify"]
description = "Run the pre-push checks hk would have run, which jj never fires"
run = "hk check --all"

[tasks."jj:push"]
description = "Sync with GitHub, run the pre-push checks, advance main to the working copy's parent, and push it"
depends = ["jj:sync"]
run = ["mise run jj:verify", "jj bookmark set main -r @- && jj git push -b main"]

[tasks."jj:status"]
description = "Show main's ahead/behind vs GitHub, unpushed local commits, and the working-copy diff"
run = ["jj bookmark list -a", "jj log -r 'trunk()..@'", "jj status"]

[tasks."jj:branch"]
description = "Create a bookmark at the working copy's parent and push it to GitHub as a new branch"
usage = 'arg "<name>"'
run = "jj bookmark create $usage_name -r @- && jj git push -b $usage_name"

[tasks."jj:pr"]
description = "Open a GitHub PR for a branch already pushed with jj:branch"
usage = 'arg "<name>"'
run = "gh pr create --head $usage_name --fill"

# Pins that override the template's "latest". An unpinned formatter drifts
# between a laptop and a CI runner, and the check then fails only in CI.
[tools]
tombi = "1.4.0"
# Reachability from main, which is the orphan check `unused` cannot do for a
# module that is all internal/: every symbol there is exported API to the
# compiler, and a test counts as a use.
"go:golang.org/x/tools/cmd/deadcode" = "latest"
